services:
  identity_db:
    image: postgres:17-alpine
    container_name: identity_db
    restart: always
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports:
      - "5432:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  business_db:
    image: postgres:17-alpine
    container_name: business_db
    restart: always
    environment:
      POSTGRES_USER: business
      POSTGRES_PASSWORD: business
      POSTGRES_DB: business
    ports:
      - "5435:5432"
    volumes:
      - business_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business -d business"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  logs_db:
    image: postgres:17-alpine
    container_name: logs_db
    restart: always
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
      POSTGRES_DB: logs
    ports:
      - "5434:5432"
    volumes:
      - logs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  migrate_identity:
    image: migrate/migrate
    entrypoint: ["migrate"]
    depends_on:
      identity_db:
        condition: service_healthy
    volumes:
      - ./migrations/identity:/migrations
    command: >
      -path /migrations
      -database "postgres://identity:identity@identity_db:5432/identity?sslmode=disable"
      up
    networks:
      - app_network

  migrate_business:
    image: migrate/migrate
    entrypoint: ["migrate"]
    depends_on:
      business_db:
        condition: service_healthy
    volumes:
      - ./migrations/business:/migrations
    command: >
      -path /migrations
      -database "postgres://business:business@business_db:5432/business?sslmode=disable"
      up
    networks:
      - app_network

  migrate_logs:
    image: migrate/migrate
    entrypoint: ["migrate"]
    depends_on:
      logs_db:
        condition: service_healthy
    volumes:
      - ./migrations/logs:/migrations
    command: >
      -path /migrations
      -database "postgres://logs:logs@logs_db:5432/logs?sslmode=disable"
      up
    networks:
      - app_network

  nats:
    image: nats:2.10-alpine
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--js", "--sd=/data", "--http_port=8222"]
    volumes:
      - nats_data:/data
    restart: always
    networks:
      - app_network

  nats-setup:
    image: natsio/nats-box:latest
    container_name: nats-setup
    depends_on:
      - nats
    entrypoint: ["sh", "-c"]
    command: |
      until nats --server nats:4222 server check >/dev/null 2>&1; do sleep 1; done
      nats --server nats:4222 stream add employee-events --storage file --retention limits --subjects "employee.event.*" --max-msgs=-1 --defaults 2>/dev/null || true
      nats --server nats:4222 stream add logs-stream --storage file --retention limits --subjects "logs.*" --max-msgs=-1 --defaults 2>/dev/null || true
    restart: "no"
    networks:
      - app_network

volumes:
  identity_data:
  business_data:
  logs_data:
  nats_data:

networks:
  app_network:
    driver: bridge
