syntax = "proto3";

package identity;

option go_package = "github.com/foksdanilka34-maker/F5ProjectUsersControl/gen/go/identity";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service IdentityService {
    // Auth
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc Refresh(google.protobuf.Empty) returns (RefreshResponse);
    rpc GetMe(google.protobuf.Empty) returns (UserInfo);
    rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);

    // Profile
    rpc CreateProfile(CreateProfileRequest) returns (Profile);
    rpc GetProfile(GetProfileRequest) returns (Profile);
    rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
    rpc UpdateProfile(UpdateProfileRequest) returns (Profile);
    rpc ChangeUserStatus(ChangeUserStatusRequest) returns (google.protobuf.Empty);

    // Department
    rpc CreateDepartment(CreateDepartmentRequest) returns (Department);
    rpc GetDepartment(GetDepartmentRequest) returns (Department);
    rpc ListDepartments(google.protobuf.Empty) returns (ListDepartmentsResponse);
    rpc UpdateDepartment(UpdateDepartmentRequest) returns (Department);
    rpc DeleteDepartment(DeleteDepartmentRequest) returns (google.protobuf.Empty);

    // Position
    rpc CreatePosition(CreatePositionRequest) returns (Position);
    rpc GetPosition(GetPositionRequest) returns (Position);
    rpc ListPositions(google.protobuf.Empty) returns (ListPositionsResponse);
    rpc UpdatePosition(UpdatePositionRequest) returns (Position);
    rpc DeletePosition(DeletePositionRequest) returns (google.protobuf.Empty);

    // Skill
    rpc CreateSkill(CreateSkillRequest) returns (Skill);
    rpc ListSkills(google.protobuf.Empty) returns (ListSkillsResponse);
    rpc DeleteSkill(DeleteSkillRequest) returns (google.protobuf.Empty);
    rpc AddSkillToEmployee(AddSkillToEmployeeRequest) returns (google.protobuf.Empty);
    rpc RemoveSkillFromEmployee(RemoveSkillFromEmployeeRequest) returns (google.protobuf.Empty);
}

// Auth messages
message LoginRequest {
    string login = 1;
    string password = 2;
    string user_agent = 3;
    string ip_address = 4;
}

message LoginResponse {
    string access_token = 1;
    UserInfo user = 2;
    string refresh_token = 3;
}

message UserInfo {
    int64 id = 1;
    string login = 2;
    string full_name = 3;
    string role = 4;
    string avatar_url = 5;
}

message RefreshResponse {
    string access_token = 1;
    string refresh_token = 2;
    UserInfo user = 3;
}

message ChangePasswordRequest {
    int64 user_id = 1;
    string new_password = 2;
}

message ChangeUserStatusRequest {
    int64 user_id = 1;
    bool is_active = 2;
}

// Profile messages
message Profile {
    int64 id = 1;
    string first_name = 2;
    string last_name = 3;
    int64 position_id = 4;
    string email = 5;
    string avatar_url = 6;
    google.protobuf.Timestamp hire_date = 7;
    Department department = 8;
    repeated Skill skills = 9;
    string login = 10;
    string role = 11;
    google.protobuf.Timestamp created_at = 12;
    google.protobuf.Timestamp updated_at = 13;
    bool is_active = 14;
}

message CreateProfileRequest {
    string first_name = 1;
    string last_name = 2;
    int64 position_id = 3;
    string email = 4;
    optional int64 department_id = 5;
    google.protobuf.Timestamp hire_date = 6;
    string login = 7;
    string password = 8;
    string role = 9;
}

message GetProfileRequest {
    int64 user_id = 1;
}

message ListProfilesRequest {
    int32 page_size = 1;
    int32 page_number = 2;
    int64 department_id = 3;
    int64 position_id = 4;
}

message ListProfilesResponse {
    repeated Profile profiles = 1;
    int32 total_count = 2;
}

message UpdateProfileRequest {
    int64 user_id = 1;
    optional string first_name = 2;
    optional string last_name = 3;
    optional int64 position_id = 4;
    optional string email = 5;
    optional int64 department_id = 6;
    optional string avatar_url = 7;
}

// Department messages
message Department {
    int64 id = 1;
    string name = 2;
}

message CreateDepartmentRequest {
    string name = 1;
}

message GetDepartmentRequest {
    int64 id = 1;
}

message ListDepartmentsResponse {
    repeated Department departments = 1;
}

message UpdateDepartmentRequest {
    int64 id = 1;
    string name = 2;
}

message DeleteDepartmentRequest {
    int64 id = 1;
}

// Position messages
message Position {
    int64 id = 1;
    string name = 2;
}

message CreatePositionRequest {
    string name = 1;
}

message GetPositionRequest {
    int64 id = 1;
}

message ListPositionsResponse {
    repeated Position positions = 1;
}

message UpdatePositionRequest {
    int64 id = 1;
    string name = 2;
}

message DeletePositionRequest {
    int64 id = 1;
}

// Skill messages
message Skill {
    int64 id = 1;
    string name = 2;
}

message CreateSkillRequest {
    string name = 1;
}

message DeleteSkillRequest {
    int64 id = 1;
}

message ListSkillsResponse {
    repeated Skill skills = 1;
}

message AddSkillToEmployeeRequest {
    int64 employee_id = 1;
    int64 skill_id = 2;
}

message RemoveSkillFromEmployeeRequest {
    int64 employee_id = 1;
    int64 skill_id = 2;
}
