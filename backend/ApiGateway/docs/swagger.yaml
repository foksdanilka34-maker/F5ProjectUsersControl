basePath: /api/v1
definitions:
  models.AddMemberToProjectRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  models.AddSkillToEmployeeRequest:
    properties:
      skill_id:
        type: string
    required:
    - skill_id
    type: object
  models.AssignTaskRequest:
    properties:
      assignee_id:
        type: string
    required:
    - assignee_id
    type: object
  models.ChangeUserStatusRequest:
    properties:
      status:
        type: boolean
    required:
    - status
    type: object
  models.CreateDepartmentRequest:
    properties:
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  models.CreatePositionRequest:
    properties:
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  models.CreateProfileRequest:
    properties:
      department_id:
        type: string
      email:
        type: string
      first_name:
        type: string
      hire_date:
        type: string
      last_name:
        type: string
      login:
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
      position_id:
        type: string
      role:
        enum:
        - specialist
        - manager
        - admin
        - director
        type: string
    required:
    - email
    - first_name
    - hire_date
    - last_name
    - login
    - password
    - position_id
    - role
    type: object
  models.CreateProjectRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  models.CreateSkillRequest:
    properties:
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  models.CreateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      priority:
        maximum: 4
        minimum: 0
        type: integer
      title:
        minLength: 2
        type: string
    required:
    - due_date
    - title
    type: object
  models.LoginRequest:
    properties:
      login:
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    required:
    - login
    - password
    type: object
  models.MoveTaskRequest:
    properties:
      new_order_index:
        minimum: 0
        type: integer
      new_status:
        maximum: 4
        minimum: 1
        type: integer
    required:
    - new_order_index
    - new_status
    type: object
  models.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  models.UpdateDepartmentRequest:
    properties:
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  models.UpdatePositionRequest:
    properties:
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  models.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      department_id:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      position_id:
        type: string
    type: object
  models.UpdateProjectRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      name:
        minLength: 2
        type: string
      status:
        maximum: 3
        minimum: 0
        type: integer
    type: object
  models.UpdateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      priority:
        maximum: 4
        minimum: 0
        type: integer
      status:
        maximum: 4
        minimum: 0
        type: integer
      title:
        minLength: 2
        type: string
    type: object
  response.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  response.RefreshResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
