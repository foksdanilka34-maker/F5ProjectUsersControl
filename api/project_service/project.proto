syntax = "proto3";

package project;

option go_package = "github.com/foksdanilka34-maker/F5ProjectUsersControl/project/v1;projectv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ProjectService {
    rpc CreateProject(CreateProjectRequest) returns (Project);
    rpc GetProject(GetProjectRequest) returns (Project);
    rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
    rpc UpdateProject(UpdateProjectRequest) returns (Project);
    rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);

    rpc CreateTask(CreateTaskRequest) returns (Task);
    rpc GetTask(GetTaskRequest) returns (Task);
    rpc UpdateTask(UpdateTaskRequest) returns (Task);
    rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
    rpc MoveTask(MoveTaskRequest) returns (Task); 
    rpc AssignTask(AssignTaskRequest) returns (Task);
    rpc ListTasksByProject(ListTasksByProjectRequest) returns (ListTasksByProjectResponse);
    
    rpc AddMemberToProject(AddMemberToProjectRequest) returns (google.protobuf.Empty);
    rpc RemoveMemberFromProject(RemoveMemberFromProjectRequest) returns (google.protobuf.Empty);
    rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse);
    
    rpc GetTaskStatusHistory(GetTaskStatusHistoryRequest) returns (GetTaskStatusHistoryResponse);
    rpc GetProjectMetrics(GetProjectMetricsRequest) returns (ProjectMetrics);
}

enum TaskStatus {
    TASK_STATUS_UNSPECIFIED = 0;
    TODO = 1;
    IN_PROGRESS = 2;
    REVIEW = 3;
    DONE = 4;
}

enum TaskPriority {
    PRIORITY_UNSPECIFIED = 0;
    LOW = 1;
    MEDIUM = 2;
    HIGH = 3;
    CRITICAL = 4;
}

enum ProjectStatus {
    PROJECT_STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;
    ON_HOLD = 2;
    ARCHIVED = 3;
}

message Project {
    string id = 1;
    string name = 2;
    string description = 3; 
    string manager_id = 4; 
    ProjectStatus status = 5;
    google.protobuf.Timestamp due_date = 6; 
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}

message Task {
    string id = 1;
    string project_id = 2;
    string title = 3;
    string description = 4;
    TaskStatus status = 5;
    TaskPriority priority = 6;
    string assignee_id = 7; 
    string creator_id = 8; 
    int32 order_index = 9; 
    google.protobuf.Timestamp due_date = 10; 
    google.protobuf.Timestamp created_at = 11;
    google.protobuf.Timestamp updated_at = 12;
    optional google.protobuf.Timestamp started_at = 13;
    optional google.protobuf.Timestamp completed_at = 14;
}

message ProjectMember {
    string user_id = 1;
    string full_name = 2; 
    string role = 3; 
}

message CreateProjectRequest {
    string name = 1;
    optional string description = 2;
    string manager_id = 3;
    optional google.protobuf.Timestamp due_date = 4;
}

message GetProjectRequest {
    string project_id = 1;
}

message ListProjectsRequest {
    int32 page_size = 1; 
    int32 page_number = 2; 
    optional string manager_id = 3; 
    optional ProjectStatus status = 4; 
}

message ListProjectsResponse {
    repeated Project projects = 1;
    int32 total_count = 2; 
}

message UpdateProjectRequest {
    string project_id = 1;
    optional string name = 2;
    optional string description = 3;
    optional ProjectStatus status = 4;
    optional google.protobuf.Timestamp due_date = 5;
}

message DeleteProjectRequest {
    string project_id = 1;
}

message CreateTaskRequest {
    string project_id = 1;
    string title = 2;
    string description = 3;
    optional TaskPriority priority = 4;
    string creator_id = 5; 
    optional string assignee_id = 6; 
    google.protobuf.Timestamp due_date = 7;
}

message GetTaskRequest {
    string task_id = 1;
}

message UpdateTaskRequest {
    string task_id = 1;
    optional string title = 2;
    optional string description = 3;
    optional TaskStatus status = 4; 
    optional TaskPriority priority = 5;
    optional string assignee_id = 6; 
    optional google.protobuf.Timestamp due_date = 7;
}

message DeleteTaskRequest {
    string task_id = 1;
}

message MoveTaskRequest {
    string task_id = 1;
    TaskStatus new_status = 2;
    int32 new_order_index = 3;
}

message AssignTaskRequest {
    string task_id = 1;
    string assignee_id = 2; 
}

message ListTasksByProjectRequest {
    string project_id = 1;
    optional TaskStatus status = 2;
    optional string assignee_id = 3; 
    optional TaskPriority priority = 4; 
}

message ListTasksByProjectResponse {
    repeated Task tasks = 1;
}

message AddMemberToProjectRequest {
    string project_id = 1;
    string user_id = 2;
}

message RemoveMemberFromProjectRequest {
    string project_id = 1;
    string user_id = 2;
}

message ListProjectMembersRequest {
    string project_id = 1;
}

message ListProjectMembersResponse {
    repeated ProjectMember members = 1;
}

message TaskStatusHistoryEntry {
    string id = 1;
    string task_id = 2;
    optional TaskStatus from_status = 3;
    TaskStatus to_status = 4;
    google.protobuf.Timestamp changed_at = 5;
    optional string actor_id = 6;
}

message GetTaskStatusHistoryRequest {
    string task_id = 1;
    int32 page_size = 2;
    int32 page_number = 3;
}

message GetTaskStatusHistoryResponse {
    repeated TaskStatusHistoryEntry history = 1;
    int32 total_count = 2;
}

message GetProjectMetricsRequest {
    string project_id = 1;
    optional google.protobuf.Timestamp start_date = 2;
    optional google.protobuf.Timestamp end_date = 3;
}

message ProjectMetrics {
    string project_id = 1;
    int32 total_tasks = 2;
    int32 completed_tasks = 3;
    int32 overdue_tasks = 4;
    int32 in_progress_tasks = 5;
    double avg_completion_time_hours = 6;
    double on_time_completion_rate = 7;
    google.protobuf.Timestamp calculated_at = 8;
}
