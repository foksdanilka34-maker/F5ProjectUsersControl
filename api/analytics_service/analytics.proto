syntax = "proto3";

package analytics;

option go_package = "github.com/foksdanilka34-maker/F5ProjectUsersControl/analytics/v1;analyticsv1";

import "google/protobuf/timestamp.proto";

service AnalyticsService {
    rpc GetEmployeeMetrics(GetEmployeeMetricsRequest) returns (EmployeeMetricsResponse);
    rpc ListEmployeeMetrics(ListEmployeeMetricsRequest) returns (ListEmployeeMetricsResponse);
    rpc GetTopPerformers(GetTopPerformersRequest) returns (ListEmployeeMetricsResponse);
    
    rpc GetProjectMetrics(GetProjectMetricsRequest) returns (ProjectMetricsResponse);
    rpc ListProjectMetrics(ListProjectMetricsRequest) returns (ListProjectMetricsResponse);
    
    rpc SubscribeToMetricsUpdates(SubscribeToMetricsUpdatesRequest) returns (stream MetricsUpdate);
    
    rpc GetProductivityTrends(GetProductivityTrendsRequest) returns (ProductivityTrendsResponse);
    rpc GetCompletionRateTrends(GetCompletionRateTrendsRequest) returns (CompletionRateTrendsResponse);
    
    rpc GetDashboardStats(GetDashboardStatsRequest) returns (DashboardStatsResponse);
}

enum Period {
    PERIOD_UNSPECIFIED = 0; 
    PERIOD_DAILY = 1;   
    PERIOD_WEEKLY = 2; 
    PERIOD_MONTHLY = 3; 
}

enum HealthStatus {
    HEALTH_STATUS_UNSPECIFIED = 0;
    HEALTH_STATUS_HEALTHY = 1;      
    HEALTH_STATUS_AT_RISK = 2;     
    HEALTH_STATUS_CRITICAL = 3;    
}

message EmployeeMetrics {
    string employee_id = 1;
    
    google.protobuf.Timestamp metric_date = 2;
    
    int32 assigned_tasks = 3;
    int32 completed_tasks = 4;
    int32 in_progress_tasks = 5;
    int32 overdue_tasks = 6;
    
    double efficiency_score = 7;
    double task_completion_rate = 8;
    double on_time_completion_rate = 9;
}

message GetEmployeeMetricsRequest {
    string employee_id = 1;
}

message EmployeeMetricsResponse {
    EmployeeMetrics metrics = 1;
}

message ListEmployeeMetricsRequest {
    optional int32 page_size = 1;
    optional int32 page_number = 2;
    optional string department_id = 3;

    optional google.protobuf.Timestamp start_date = 4;
    optional google.protobuf.Timestamp end_date = 5;
}

message ListEmployeeMetricsResponse {
    repeated EmployeeMetrics metrics = 1;
    int32 total_count = 2;
}

message GetTopPerformersRequest {
    int32 limit = 1;
    optional string department_id = 2;

    optional google.protobuf.Timestamp start_date = 3;
    optional google.protobuf.Timestamp end_date = 4;
}

message ProjectMetrics {
    string project_id = 1;
    string manager_id = 2;
    
    google.protobuf.Timestamp metric_date = 3;
    
    int32 total_tasks = 4;
    int32 completed_tasks = 5;
    int32 in_progress_tasks = 6;
    int32 overdue_tasks = 7;
    
    double delivery_performance = 8;
    double schedule_performance = 9;
    double quality_performance = 10;
    double team_performance = 11;
    
    double health_index = 12;
    double risk_score = 13;
    HealthStatus health_status = 14;
    
    double velocity = 15;
    optional google.protobuf.Timestamp projected_end_date = 16;
    double team_capacity_utilization = 17;
    int32 team_size = 18;
    double avg_team_efficiency = 19;
    bool is_at_risk = 20;
    optional int32 days_until_due = 21;
}

message GetProjectMetricsRequest {
    string project_id = 1;

    optional google.protobuf.Timestamp start_date = 2;
    optional google.protobuf.Timestamp end_date = 3;
}

message ProjectMetricsResponse {
    ProjectMetrics metrics = 1;
    google.protobuf.Timestamp calculated_at = 2;
}

message ListProjectMetricsRequest {
    optional int32 page_size = 1;
    optional int32 page_number = 2;
    optional string manager_id = 3;

    optional google.protobuf.Timestamp start_date = 4;
    optional google.protobuf.Timestamp end_date = 5;
}

message ListProjectMetricsResponse {
    repeated ProjectMetrics metrics = 1;
    int32 total_count = 2;
}

message SubscribeToMetricsUpdatesRequest {
    optional string employee_id = 1;
    optional string project_id = 2;

    int32 update_interval_seconds = 3;
}

message MetricsUpdate {
    oneof update {
        EmployeeMetrics employee_metrics = 1;
        ProjectMetrics project_metrics = 2;
    }
    google.protobuf.Timestamp updated_at = 3;
}

message ProductivityTrendsResponse {
    repeated ProductivityTrendEntry entries = 1;
    Period period = 2;
}

message ProductivityTrendEntry {
    google.protobuf.Timestamp date = 1;
    double avg_efficiency = 2;
    int32 total_tasks_completed = 3;
    int32 total_employees_active = 4;
}

message GetProductivityTrendsRequest {
    Period period = 1; 
    int32 limit = 2; 

    optional string department_id = 3;
    optional string employee_id = 4;
}

message CompletionRateTrendsResponse {
    repeated CompletionRateTrendEntry entries = 1;
    Period period = 2;
}

message CompletionRateTrendEntry {
    google.protobuf.Timestamp date = 1;
    double on_time_rate = 2; 
    double overall_rate = 3; 
    int32 completed_count = 4;
    int32 overdue_count = 5;
}

message GetCompletionRateTrendsRequest {
    Period period = 1; 
    int32 limit = 2;
    optional string project_id = 3;
    optional string department_id = 4;
}

message DashboardStatsResponse {
    int32 total_employees = 1;
    int32 active_employees = 2;
    
    int32 total_projects = 3;
    int32 active_projects = 4;
    
    int32 total_tasks = 5;
    int32 completed_tasks = 6;
    int32 overdue_tasks = 7;
    
    double avg_company_efficiency = 8;
    double avg_on_time_rate = 9;
    
    repeated TopEmployee top_employees = 10;
    repeated BottomProject problematic_projects = 11;
    
    google.protobuf.Timestamp calculated_at = 12;
}

message TopEmployee {
    string employee_id = 1;
    double efficiency_score = 2;
    int32 tasks_completed = 3;
}

message BottomProject {
    string project_id = 1;
    double health_score = 2;
    double on_time_rate = 3;
}

message GetDashboardStatsRequest {
    optional google.protobuf.Timestamp start_date = 1;
    optional google.protobuf.Timestamp end_date = 2;
}
